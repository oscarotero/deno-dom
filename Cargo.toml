[package]
name = "dom_wasm"
version = "0.1.0"
authors = ["b-fuze <b-fuze.root@live.com>"]
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-mutable-globals"]

[dependencies]
html5ever = "0.40.1"
markup5ever = "0.40.0"
serde_json = "1.0"
serde = "1.0.111"
wasm-bindgen = "0.2.100"

[lib]
crate-type = ["cdylib"]
